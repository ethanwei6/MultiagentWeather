name: Verify public release

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for credentials
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xzf "$archive" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --ignore-gitleaks-allow --log-opts=--all .

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check reproducible synthetic trade examples
        run: |
          python showcase/scripts/generate-demo.py
          git diff --quiet -- showcase/public/results.json showcase/public/evidence.json

      - name: Test the research package
        run: |
          python -m pip install .
          python -m unittest discover -s tests

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - name: Build the public showcase
        working-directory: showcase
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
