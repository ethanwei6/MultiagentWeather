[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagentweather"
version = "0.1.0"
description = "Daily-high temperature prediction-market research tooling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ethan Wei" }]
dependencies = ["polars==1.36.1"]

[project.scripts]
dailyweather = "daily_weather_pipeline.cli:main"

[tool.setuptools]
packages = ["daily_weather_pipeline"]

